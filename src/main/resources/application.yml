spring:
  application:
    name: samp
  datasource:
    url: ${SAMP_DB_URL:jdbc:postgresql://localhost:5432/samp}
    username: ${SAMP_DB_USERNAME:samp}
    password: ${SAMP_DB_PASSWORD:samp_local_dev}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 5
  thymeleaf:
    cache: false
    encoding: UTF-8
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

samp:
  app-name: Sistema Automatizado de Mejores Precios
  default-currency: ${SAMP_DEFAULT_CURRENCY:COP}
  reference-currency: USD
  default-locale: ${SAMP_DEFAULT_LOCALE:es-CO}
  ai:
    provider: ${SAMP_AI_PROVIDER:mock}
    model: ${SAMP_AI_MODEL:gemini-2.5-flash}
    gemini-api-key: ${GEMINI_API_KEY:}
    max-tool-calls: 5
  scraper:
    user-agent: "SAMPBot/1.0 (+https://github.com/fran3004/samp; Proyecto Academico UPC)"
    min-delay-ms: 1000
    max-delay-ms: 3000
    default-ttl-minutes: 1440
    min-completeness-pct: 80.0
  storage:
    json-dir: ${SAMP_DATA_DIR:./data-json}
